<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celhrox Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #2294AA;
            --bg-color: #090D14;
            --text-color: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .logo-hover {
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .logo-hover:hover {
            transform: scale(1.2) rotate(2deg);
            filter: drop-shadow(0 0 20px var(--primary-color));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- SES EFEKTİ (ENDERMAN TELEPORT) -->
    <audio id="teleportSound" src="https://files.catbox.moe/tw1c86.mp3" preload="auto"></audio>

    <!-- HEADER / ÜST MENÜ -->
    <header class="border-b border-gray-800 p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
        <!-- SOL TARAFA HİZALANMIŞ MENÜ -->
        <nav class="flex items-center gap-6">
            <a href="#hero" class="text-lg font-medium hover:text-[var(--primary-color)] transition-colors">Ana Sayfa</a>
            <a href="#features" class="text-lg font-medium hover:text-[var(--primary-color)] transition-colors">Özellikler</a>
            <a id="discordBtn" href="https://discord.gg/7KNwXBBb6xy" target="_blank" class="bg-[#2294AA] hover:bg-opacity-80 px-4 py-2 rounded-lg font-semibold transition-all flex items-center gap-2">
                <span>Discord</span>
                <span id="discordStats" class="text-xs bg-black/40 px-2 py-0.5 rounded-full">Yükleniyor...</span>
            </a>
        </nav>

        <!-- SAĞ TARAFTA BÜYÜK CELHROX LOGOSU -->
        <div class="flex items-center">
            <img id="mainLogo" src="https://files.catbox.moe/kq195p.png" alt="Celhrox Logo" class="w-24 h-24 object-contain cursor-pointer logo-hover">
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="max-w-7xl mx-auto w-full p-6 flex-1 flex flex-col items-center justify-center text-center">
        <!-- HERO BÖLÜMÜ -->
        <section id="hero" class="my-12">
            <h1 id="siteTitle" class="text-5xl font-extrabold mb-4">Celhrox Sunucu Portalı</h1>
            <p id="siteDesc" class="text-gray-400 text-lg max-w-2xl mx-auto mb-8">Topluluğumuza katılın, en son güncellemeleri takip edin ve özel içeriklere erişin.</p>
        </section>

        <!-- ÖZELLİKLER BÖLÜMÜ -->
        <section id="features" class="w-full my-12">
            <h2 class="text-3xl font-bold mb-8 text-left border-b border-gray-800 pb-2">Sunucu Özellikleri</h2>
            <div id="featuresContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Dinamik özellikler JavaScript ile doldurulur -->
            </div>
        </section>
    </main>

    <!-- FOOTER / TELİF HAKKI (ÜÇ KERE TIKLAYINCA GİZLİ ADMİN PANELİ) -->
    <footer class="border-t border-gray-800 p-6 text-center text-gray-500 text-sm">
        <p id="copyrightText" class="cursor-pointer select-none hover:text-gray-400 transition-colors">
            © 2026 Celhrox Portal. Tüm Hakları Saklıdır.
        </p>
    </footer>

    <!-- GİZLİ ADMİN PANELİ MODAL -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-lg rounded-2xl p-6 text-left relative max-h-[90vh] overflow-y-auto">
            <button id="closeAdmin" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
            
            <!-- GİRİŞ FORMU -->
            <div id="adminAuth">
                <h2 class="text-2xl font-bold mb-4">Admin Girişi</h2>
                <input type="password" id="adminPassword" placeholder="Şifrenizi girin..." class="w-full bg-black border border-gray-800 rounded-lg p-3 text-white mb-4 focus:outline-none">
                <button id="loginBtn" class="w-full bg-[#2294AA] py-3 rounded-lg font-bold">Giriş Yap</button>
            </div>

            <!-- ADMİN KONTROL PANELİ -->
            <div id="adminPanel" class="hidden space-y-6">
                <h2 class="text-2xl font-bold border-b border-gray-800 pb-2">Admin Paneli</h2>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Site Başlığı</label>
                    <input type="text" id="editTitle" class="w-full bg-black border border-gray-800 rounded p-2 text-white text-sm">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Yeni Şifre</label>
                    <input type="password" id="newPass" placeholder="Yeni şifre belirleyin" class="w-full bg-black border border-gray-800 rounded p-2 text-white text-sm">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Ana Renk</label>
                    <input type="color" id="editColor" value="#2294AA" class="w-full h-10 bg-black border border-gray-800 rounded cursor-pointer">
                </div>

                <button id="saveAdminSettings" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded font-bold transition-colors">Ayarları Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Ses Efekti Çalıştırma (Logo Tıklaması)
        const logo = document.getElementById('mainLogo');
        const sound = document.getElementById('teleportSound');
        logo.addEventListener('click', () => {
            sound.currentTime = 0;
            sound.play().catch(() => {});
        });

        // Discord Proxy Bağlantısı
        const DISCORD_CODE = "7KNwXBBb6xy";
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://discord.com/api/v10/invites/${DISCORD_CODE}?with_counts=true`)}`;

        fetch(proxyUrl)
            .then(res => res.json())
            .then(data => {
                if(data.approximate_presence_count) {
                    document.getElementById('discordStats').innerText = `${data.approximate_presence_count} Çevrim içi`;
                } else {
                    document.getElementById('discordStats').innerText = `Katıl`;
                }
            })
            .catch(() => {
                document.getElementById('discordStats').innerText = `Katıl`;
            });

        // Üç Kere Tıklama (Triple Click) ile Gizli Admin
        let clickCount = 0;
        let clickTimer;
        const copyrightText = document.getElementById('copyrightText');
        const adminModal = document.getElementById('adminModal');

        copyrightText.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount === 3) {
                adminModal.classList.remove('hidden');
                clickCount = 0;
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
        });

        document.getElementById('closeAdmin').addEventListener('click', () => {
            adminModal.classList.add('hidden');
        });

        // Admin Ayarları Saklama
        let currentPass = localStorage.getItem('celhrox_admin_pass') || 'admin123';

        document.getElementById('loginBtn').addEventListener('click', () => {
            if(document.getElementById('adminPassword').value === currentPass) {
                document.getElementById('adminAuth').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('editTitle').value = document.getElementById('siteTitle').innerText;
            } else {
                alert('Hatalı Şifre!');
            }
        });

        document.getElementById('saveAdminSettings').addEventListener('click', () => {
            const newTitle = document.getElementById('editTitle').value;
            const newPass = document.getElementById('newPass').value;
            const newColor = document.getElementById('editColor').value;

            if(newTitle) document.getElementById('siteTitle').innerText = newTitle;
            if(newPass) {
                currentPass = newPass;
                localStorage.setItem('celhrox_admin_pass', newPass);
            }
            if(newColor) {
                document.styleSheets[0].insertRule(`:root { --primary-color: ${newColor} !important; }`, 0);
            }

            alert('Ayarlar Güncellendi!');
            adminModal.classList.add('hidden');
        });
    </script>
</body>
</html>
